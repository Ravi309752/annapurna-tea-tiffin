
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Annapurna - Admin Dashboard</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #fffaf2;
  color: #30251d;
}

header {
  background: #79351f;
  color: white;
  padding: 20px;
  text-align: center;
}

main {
  max-width: 1000px;
  margin: auto;
  padding: 20px;
}

h2 {
  color: #79351f;
}

.card {
  background: white;
  border: 1px solid #ead8c4;
  border-radius: 10px;
  padding: 16px;
  margin: 15px 0;
}

button {
  background: #79351f;
  color: white;
  border: 0;
  padding: 10px 14px;
  margin: 4px;
  border-radius: 6px;
  cursor: pointer;
}

button:hover {
  background: #542414;
}

input {
  padding: 10px;
  margin: 5px;
  border: 1px solid #d8c4b0;
  border-radius: 6px;
}

.notice {
  background: #fff0d5;
  padding: 12px;
  border-radius: 8px;
}
</style>
</head>

<body>

<header>
  <h1>ANNAPURNA TEA & TIFFINS</h1>
  <p>Hotel Admin Dashboard</p>
</header>

<main>

<h2>Incoming Orders</h2>

<p class="notice">
  This dashboard displays orders saved in this browser.
</p>

<button onclick="showOrders()">Refresh Orders</button>

<div id="orders"></div>

</main>

<script>

function showOrders() {

  const orders = JSON.parse(
    localStorage.getItem("orders") || "[]"
  );

  const container = document.getElementById("orders");

  if (orders.length === 0) {
    container.innerHTML = "<p>No orders received yet.</p>";
    return;
  }

  container.innerHTML = orders.map(order => `

    <div class="card">

      <h3>Order #${order.id}</h3>

      <p><strong>Customer:</strong> ${order.name}</p>

      <p><strong>Table:</strong> ${order.table}</p>

      <p><strong>Items:</strong>
        ${order.items.map(item =>
          item.name + " × " + item.qty
        ).join(", ")}
      </p>

      <p><strong>Total:</strong> ₹${order.total}</p>

      <p><strong>Payment:</strong> ${order.payment}</p>

      <p><strong>Status:</strong> ${order.status}</p>

      <button onclick="updateStatus(${order.id}, 'Preparing')">
        Preparing
      </button>

      <button onclick="updateStatus(${order.id}, 'Ready')">
        Ready
      </button>

      <button onclick="updateStatus(${order.id}, 'Served')">
        Served
      </button>

    </div>

  `).join("");

}

function updateStatus(id, status) {

  const orders = JSON.parse(
    localStorage.getItem("orders") || "[]"
  );

  const order = orders.find(item => item.id === id);

  if (order) {

    order.status = status;

    localStorage.setItem(
      "orders",
      JSON.stringify(orders)
    );

    showOrders();
  }

}

showOrders();

</script>

</body>
</html>
